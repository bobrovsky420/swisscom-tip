[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swisstip-core"
version = "0.1.0"
description = "Versioned knowledge and structured grounding contracts for SwissTIP"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
