[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swisstip-ingestion"
version = "0.1.0"
description = "Bounded source acquisition for the Swisscom Trusted Information Platform"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

