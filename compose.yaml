name: swisstip-pilot
services:
  db:
    image: pgvector/pgvector:0.8.2-pg17
    environment:
      POSTGRES_DB: swisstip
      POSTGRES_USER: swisstip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/storage/init_local.py first}
    ports:
      - "127.0.0.1:${SWISSTIP_DB_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swisstip -d swisstip"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
volumes:
  postgres-data:
