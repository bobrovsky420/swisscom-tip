[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swisstip-knowledge-builder"
version = "0.1.0"
description = "Operator CLI for SwissTIP knowledge acquisition"
requires-python = ">=3.11"
dependencies = ["swisstip-ingestion==0.1.0"]

[project.scripts]
swisstip-crawl = "swisstip.builder.cli:main"
swisstip-concepts = "swisstip.builder.concept_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
