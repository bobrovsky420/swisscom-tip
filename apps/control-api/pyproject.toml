[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swisstip-control-api"
version = "0.1.0"
description = "Local operator console API and persisted ingestion worker"
requires-python = ">=3.11"
dependencies = ["fastapi==0.141.1", "uvicorn==0.52.4", "swisstip-runtime[postgres]==0.1.0", "swisstip-knowledge-builder==0.1.0", "tomli-w>=1.2,<2"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
