[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swisstip-mcp-server"
version = "0.1.0"
description = "Thin stdio MCP adapter for SwissTIP structured knowledge"
requires-python = ">=3.11"
dependencies = ["swisstip-runtime==0.1.0", "mcp>=1.28,<2"]

[project.scripts]
swisstip-mcp = "swisstip.mcp_server.server:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
