schema_version = "swisstip.semantic-model-profiles/v1"

[semantic_model]
active_profile = "ollama_local"

[generation]
temperature = 0.0
max_output_tokens = 4096

[extraction]
# Keep the frozen v3 baseline; --structured selects the separately versioned v4 path.
prompt_profile = "concept_extraction_v3"
# Optional UTF-8 files replacing the complete system prompt for each role.
# Paths are relative to this TOML file; omit to use packaged defaults.
# extraction_prompt_file = "prompts/my-extraction.md"
# review_prompt_file = "prompts/my-review.md"
max_repair_attempts = 1
chunk_content_characters = 6400
chunk_overlap_characters = 400
max_concepts_per_chunk = 6
max_pages_per_run = 10
max_total_input_characters = 120000
max_model_requests_per_page = 12
# Includes generation and semantic review calls. Unused review slots are skipped.
max_model_requests_per_run = 30

[recovery]
# Additional attempts per transient HF failure, within the same request budgets.
max_retries = 2
backoff_seconds = 2.0
max_backoff_seconds = 30.0
# Separate cap for the provider's Retry-After header, with progress every 15s.
max_retry_after_seconds = 300.0
# Only after a truncated review; batches shrink to single proposals if needed.
review_fallback_batch_size = 2

[profiles.ollama_local]
adapter = "ollama"
model = "MichelRosselli/apertus:8b-instruct-2509-q4_k_m"
base_url = "http://127.0.0.1:11434"
timeout_seconds = 180.0
num_ctx = 8192
keep_alive = "5m"

[profiles.apertus_8b]
adapter = "huggingface"
model = "swiss-ai/Apertus-8B-Instruct-2509"
base_url = "https://router.huggingface.co/v1"
timeout_seconds = 120.0
provider = "publicai"
token_env = "HF_TOKEN"

[profiles.apertus_70b]
adapter = "huggingface"
model = "swiss-ai/Apertus-70B-Instruct-2509"
base_url = "https://router.huggingface.co/v1"
timeout_seconds = 180.0
provider = "publicai"
token_env = "HF_TOKEN"
# For organization billing, configure: bill_to = "your-organization"

# Experimental compatibility option; local validation and review remain required.
# Select this profile explicitly; there is no automatic response-mode fallback.
[profiles.apertus_70b_prompt_only]
adapter = "huggingface"
model = "swiss-ai/Apertus-70B-Instruct-2509"
base_url = "https://router.huggingface.co/v1"
timeout_seconds = 180.0
provider = "publicai"
token_env = "HF_TOKEN"
response_mode = "prompt_only"
