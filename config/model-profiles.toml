# Shared model identities and connections for extraction, embedding and ranking.
# Role-specific options and active selections stay in semantic-models.toml and
# retrieval-models.toml. Credentials are environment variable references only.
schema_version = "swisstip.model-profiles/v1"

[profiles.apertus_8b_ollama]
adapter = "ollama"
model = "MichelRosselli/apertus:8b-instruct-2509-q4_k_m"
base_url = "http://127.0.0.1:11434"

[profiles.apertus_8b]
adapter = "huggingface"
model = "swiss-ai/Apertus-8B-Instruct-2509"
base_url = "https://router.huggingface.co/v1"
provider = "publicai"
token_env = "HF_TOKEN"

[profiles.apertus_70b]
adapter = "huggingface"
model = "swiss-ai/Apertus-70B-Instruct-2509"
base_url = "https://router.huggingface.co/v1"
provider = "publicai"
token_env = "HF_TOKEN"
# For organization billing, configure: bill_to = "your-organization"

[profiles.qwen_embedding_0_6b]
adapter = "ollama"
model = "qwen3-embedding:0.6b"
base_url = "http://127.0.0.1:11434"

[profiles.qwen_embedding_4b]
adapter = "ollama"
model = "qwen3-embedding:4b"
base_url = "http://127.0.0.1:11434"

[profiles.qwen_embedding_8b]
adapter = "ollama"
model = "qwen3-embedding:8b"
base_url = "http://127.0.0.1:11434"

[profiles.qwen_ranking_9b]
adapter = "ollama"
model = "qwen3.5:9b"
base_url = "http://127.0.0.1:11434"

[profiles.groq_gpt_oss_20b]
adapter = "groq"
model = "openai/gpt-oss-20b"
base_url = "https://api.groq.com/openai/v1"
token_env = "GROQ_API_KEY"

[profiles.groq_gpt_oss_120b]
adapter = "groq"
model = "openai/gpt-oss-120b"
base_url = "https://api.groq.com/openai/v1"
token_env = "GROQ_API_KEY"
