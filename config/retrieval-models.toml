# Runtime retrieval only. OpenCode's caller model is configured separately.
# A real release must pin these models/adapter IDs and contain a matching index.
schema_version = "swisstip.retrieval-model-profiles/v1"

[embedding]
active_profile = "qwen_embedding_0_6b"

[ranking]
active_profile = "apertus_ranking_8b"

[profiles.qwen_embedding_0_6b]
adapter = "ollama"
role = "embedding"
model = "qwen3-embedding:0.6b"
base_url = "http://127.0.0.1:11434"
timeout_seconds = 30.0

[profiles.qwen_embedding_4b]
adapter = "ollama"
role = "embedding"
model = "qwen3-embedding:4b"
base_url = "http://127.0.0.1:11434"
timeout_seconds = 30.0

[profiles.qwen_embedding_8b]
adapter = "ollama"
role = "embedding"
model = "qwen3-embedding:8b"
base_url = "http://127.0.0.1:11434"
timeout_seconds = 30.0

[profiles.apertus_ranking_8b]
adapter = "ollama"
role = "ranking"
model = "MichelRosselli/apertus:8b-instruct-2509-q4_k_m"
base_url = "http://127.0.0.1:11434"
timeout_seconds = 60.0

[profiles.qwen_ranking_9b]
adapter = "ollama"
role = "ranking"
model = "qwen3.5:9b"
base_url = "http://127.0.0.1:11434"
timeout_seconds = 60.0

[profiles.groq_gpt_oss_20b]
adapter = "groq"
role = "ranking"
model = "openai/gpt-oss-20b"
base_url = "https://api.groq.com/openai/v1"
token_env = "GROQ_API_KEY"
timeout_seconds = 60.0

[profiles.groq_gpt_oss_120b]
adapter = "groq"
role = "ranking"
model = "openai/gpt-oss-120b"
base_url = "https://api.groq.com/openai/v1"
token_env = "GROQ_API_KEY"
timeout_seconds = 60.0

# Experimental ordinal rubric: 0 unrelated, 1 topic-only, 2 partial, 3 direct.
# Requires groq-ranking/v2 in the release; cutoff 3 selects direct support only.
# Separate evaluation required. Existing active selection remains v1.
[profiles.groq_answer_relevance_20b]
adapter = "groq"
role = "ranking"
scoring_contract = "answer_relevance_v2"
model = "openai/gpt-oss-20b"
base_url = "https://api.groq.com/openai/v1"
token_env = "GROQ_API_KEY"
timeout_seconds = 60.0
